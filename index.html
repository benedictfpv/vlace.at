<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vlace.at - Domain zum Verkauf</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #ffffff;
            color: #333333;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            background-image: linear-gradient(to bottom right, rgba(245, 245, 245, 0.3), rgba(245, 245, 245, 0.1));
        }
        
        .container {
            max-width: 800px;
            text-align: center;
            animation: fadeIn 1s ease-in;
        }
        
        .domain-name {
            font-family: 'Playfair Display', serif;
            font-size: 4.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: #1a1a1a;
            letter-spacing: -1px;
            text-transform: lowercase;
            position: relative;
            display: inline-block;
            padding-bottom: 0.5rem;
        }
        
        .domain-name::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 2px;
            background-color: #c9a87a;
        }
        
        .tagline {
            font-size: 1.4rem;
            font-weight: 300;
            margin-bottom: 3rem;
            color: #333333;
            letter-spacing: 0.5px;
        }
        
        .contact {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            color: #555555;
        }
        
        .contact strong {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
        
        .email-link {
            display: inline-block;
            color: #c9a87a;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }
        
        .email-link:hover {
            color: #b08e5e;
        }
        
        .card {
            background-color: #ffffff;
            border-radius: 3px;
            padding: 4rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            margin-top: 2.5rem;
            width: 100%;
            border: 1px solid #f0f0f0;
            position: relative;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 1px solid #ebebeb;
            pointer-events: none;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @media (max-width: 768px) {
            .domain-name {
                font-size: 3.2rem;
            }
            
            .tagline {
                font-size: 1.2rem;
            }
            
            .card {
                padding: 3rem 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="domain-name">vlace.at</h1>
        
        <div class="card">
            <p class="tagline">Diese Domain steht zum Verkauf verfügbar.</p>
            
            <p class="contact">
                <strong>Kontakt: </strong>
                <a href="mailto:jarosbenedict@gmail.com" class="email-link">jarosbenedict@gmail.com</a>
            </p>
        </div>
    </div>
</body>
</html>
